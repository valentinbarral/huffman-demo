<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Valentin Barral">
    <meta name="description" content="Interactive web application to visualize the Huffman encoding algorithm step-by-step">
    <meta name="license" content="CC BY 4.0">
    <title>Demostración del Algoritmo de Huffman</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <button class="hamburger" onclick="toggleMenu()" aria-label="Menú">☰</button>
        <h1 data-i18n="title">Huffman demo</h1>
        <nav class="header-controls" id="headerControls">
            <button class="theme-btn" onclick="toggleTheme()">🌓</button>
            <select class="lang-sel" onchange="changeLang(this.value)" id="langSelect">
                <option value="es">Español</option>
                <option value="en">English</option>
                <option value="gl">Galego</option>
            </select>
        </nav>
    </header>

    <div class="container">
        <div class="main-content">
            <div class="control-panel">
                <div class="input-section">
                    <h3 data-i18n="inputTitle">Datos de Entrada</h3>
                    <div class="examples">
                        <button class="btn btn-secondary" onclick="loadExample1()" data-i18n="example1">Ejemplo 1</button>
                        <button class="btn btn-secondary" onclick="loadExample2()" data-i18n="example2">Ejemplo 2</button>
                        <button class="btn btn-secondary" onclick="loadExample3()" data-i18n="example3">Ejemplo 3</button>
                    </div>
                    <div class="custom-input">
                        <label data-i18n="customInputLabel">Símbolos y Frecuencias (formato: a:0.5,b:0.3,c:0.2)</label>
                        <textarea id="customInput" rows="3" data-i18n-placeholder="customInputPlaceholder" placeholder="a:0.5,b:0.3,c:0.2"></textarea>
                        <button class="btn btn-primary" onclick="loadCustomInput()" data-i18n="loadDataButton">Cargar Datos</button>
                    </div>
                </div>

                <div class="frequency-table-container">
                    <h3 data-i18n="frequencyTableTitle">Tabla de Frecuencias</h3>
                    <p class="order-note" data-i18n="frequencyTableNote">📊 Ordenadas de menor a mayor frecuencia</p>
                    <div id="frequencyTable" class="table-wrapper"></div>
                </div>
            </div>

            <div class="visualization-panel">
                <div class="canvas-container">
                    <canvas id="treeCanvas"></canvas>
                </div>

                <div class="navigation-controls">
                    <button class="btn btn-nav" id="firstBtn" onclick="goToFirst()" data-i18n="firstButton">⏮️ Inicio</button>
                    <button class="btn btn-nav" id="prevBtn" onclick="previousStep()" data-i18n="prevButton">⏪ Anterior</button>
                    <div class="step-indicator">
                        <span id="currentStep">0</span> / <span id="totalSteps">0</span>
                    </div>
                    <button class="btn btn-nav" id="nextBtn" onclick="nextStep()" data-i18n="nextButton">Siguiente ⏩</button>
                    <button class="btn btn-nav" id="lastBtn" onclick="goToLast()" data-i18n="lastButton">⏭️ Final</button>
                </div>

                <div class="step-description">
                    <h3 data-i18n="stepDescriptionTitle">Descripción del Paso</h3>
                    <p id="stepDescription" data-i18n="initialDescription">🎬 Carga un ejemplo o datos personalizados para comenzar.</p>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p data-i18n-html="footerText"></p>
    </footer>

    <script src="i18n.js"></script>
    <script src="huffman.js"></script>
    <script src="visualization.js"></script>
    <script src="app.js"></script>
</body>
</html>
